name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/alchemy-convex-docs-first
    paths:
      - "website/**"
      - "packages/alchemy/**"
      - "scripts/generate-api-reference.ts"
      - "bun.lock"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/configure-pages@v5

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - run: bun install

      - name: Build website
        working-directory: website
        env:
          GITHUB_PAGES: "true"
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}
          PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run build

      - name: Rewrite artifact for project Pages
        working-directory: website
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/rewrite-github-pages-base.ts

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
